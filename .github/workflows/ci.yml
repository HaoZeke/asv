name: Linux and MacOS CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.9", "3.14", "pypy-3.11"]
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv for Linux interpreter management
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.9

      # We need Python 3.9 to always be installed, so tests with
      # multiple environments can run.
      - name: Set up Python 3.9
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: 3.9

      - name: Install Python 3.9 for asv environment tests
        if: runner.os == 'Linux'
        run: |
          uv python install 3.9
          PY39_BIN="$(uv python find --managed-python --no-project 3.9)"
          echo "$(dirname "$PY39_BIN")" >> "$GITHUB_PATH"

      - name: Install mercurial on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mercurial

      - name: Install mercurial and conda
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install --cask anaconda
          pip install mercurial

      - name: Set up Python version ${{ matrix.python-version }}
        if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Python version ${{ matrix.python-version }} with uv
        if: runner.os == 'Linux'
        run: |
          uv python install "${{ matrix.python-version }}"
          PY_BIN="$(uv python find --managed-python --no-project "${{ matrix.python-version }}")"
          uv venv --seed --python "$PY_BIN" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Setup a browser for more tests
        uses: browser-actions/setup-chrome@latest

      - name: Set up Rust for PyPy dependency builds
        if: runner.os == 'Linux' && matrix.python-version == 'pypy-3.11'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (with --pre)
        run: python -m pip install ".[test,hg,envs]" --pre

      - name: Install asv
        run: pip install .

      - name: Run tests
        run: python -m pytest -v --timeout=300 --webdriver=ChromeHeadless --durations=100 test

  test_env:
    name: test_environments
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
      fail-fast: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          init-shell: >-
            bash
          environment-name: test-env
          cache-environment: true
          create-args: >-
            python
            pip
            py_rattler
            conda-build

      - name: Install dependencies
        run: python -m pip install ".[test,hg,envs]" --pre
        shell: micromamba-shell {0}

      - name: Install asv
        run: pip install .
        shell: micromamba-shell {0}

      - name: Run tests
        run: pytest -k environment_bench -vvvvv
        shell: micromamba-shell {0}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install asv
        run: pip install ".[doc]"

      - name: Build docs
        run: sphinx-build -W docs/source html
